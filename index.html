<style>
/* Layout: navy header bands (Brainscape-style), one 760px column on phones, sidebar + column on wide screens; study screen with a thumb-zone rating dock. */
:root{
  --band:#162240; --band-ink:#FFFFFF; --band-soft:#22335C; --band-muted:#AFC0E2;
  --paper:#EEF1F6; --card:#FFFFFF; --ink:#15203A; --muted:#5A6479; --line:#D9DFEA; --soft:#E5EAF2;
  --accent:#2E9FD8; --accent-ink:#FFFFFF; --accent-soft:#DDF0FA; --rule:#E9A3A3; --mark:#FFE58A;
  --ok:#2F8F55; --bad:#C83E3A; --warn:#B7791F; --c0:#C3CBD9;
  --tile:#162240; --c1:#A12D86; --c2:#F28B30; --c3:#E9BC22; --c4:#6FAA36; --c5:#2E9FD8;
  --display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --fs:1;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --band:#0F1830; --band-soft:#1B2848; --band-muted:#93A6CC;
  --paper:#0B1222; --card:#16203A; --ink:#E6EBF4; --muted:#98A3BA; --line:#26324E; --soft:#1D2944;
  --accent:#45B2E6; --accent-ink:#0B1222; --accent-soft:#163650; --rule:#7A3A3A; --mark:#5E5214;
  --ok:#5CC484; --bad:#F07067; --warn:#E3B04B; --c0:#3A4766; --tile:#2A3B66; color-scheme:dark}}
:root[data-theme="dark"]{
  --band:#0F1830; --band-soft:#1B2848; --band-muted:#93A6CC;
  --paper:#0B1222; --card:#16203A; --ink:#E6EBF4; --muted:#98A3BA; --line:#26324E; --soft:#1D2944;
  --accent:#45B2E6; --accent-ink:#0B1222; --accent-soft:#163650; --rule:#7A3A3A; --mark:#5E5214;
  --ok:#5CC484; --bad:#F07067; --warn:#E3B04B; --c0:#3A4766; --tile:#2A3B66; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.5 var(--body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.col{width:100%;max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.eyebrow{font:700 .72rem/1 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:.86rem} .num{font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .between{justify-content:space-between} .grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.section{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:700;text-decoration:none;color:inherit}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.btn.ghost{background:transparent;border-color:transparent}
.btn.block{width:100%} .btn.sm{min-height:38px;padding:0 14px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:default}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:inline-grid;place-items:center;font-size:1.05rem;flex:none}

.pill.over{background:color-mix(in srgb,var(--c1) 16%,transparent);color:var(--c1)}
.pill.exam{background:color-mix(in srgb,var(--c1) 18%,transparent);color:var(--c1)}
.pill.active{background:var(--accent-soft);color:var(--accent)}
.pill.maintain{background:var(--soft);color:var(--muted)}
.pill.paused{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.cbar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--c0)} .cbar i{display:block;height:100%}
.band{background:var(--band);color:var(--band-ink);padding-top:env(safe-area-inset-top,0px)}
.band .col{padding-block:14px 18px}
.bandtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font:700 1.05rem var(--display)} .brand img{width:30px;height:30px;border-radius:8px}

.sync i{width:8px;height:8px;border-radius:50%;background:var(--band-muted)}
.sync[data-s="synced"] i{background:#5CC484} .sync[data-s="syncing"] i{background:#E9BC22} .sync[data-s="error"] i,.sync[data-s="offline"] i{background:#F07067}

.hello{font:700 1.55rem/1.15 var(--display);margin-top:12px}

.tabs button[aria-current="page"]{color:var(--accent)} .tabs svg{width:22px;height:22px}
main.col{padding-block:6px 110px}

.subj{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.code{font:700 .9rem var(--mono);width:50px;height:50px;border-radius:12px;display:grid;place-items:center;background:var(--tile);color:#fff;flex:none}
.right{text-align:right;font-size:.8rem;line-height:1.3} .right b{font-size:1rem;font-variant-numeric:tabular-nums}
.testcard{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.days{min-width:58px;text-align:center;border-radius:12px;background:var(--accent-soft);color:var(--accent);padding:6px 4px}

.seg button{border:0;background:none;min-height:36px;padding:0 14px;font-weight:700;font-size:.86rem}

.seg.full{display:flex} .seg.full button{flex:1;min-height:44px}
.ring{position:relative;display:grid;place-items:center} .ring svg{display:block}
.ring .lbl{position:absolute;text-align:center} .ring .lbl b{display:block;font:700 2rem/1 var(--display);font-variant-numeric:tabular-nums}
.ring .lbl span{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.statrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 2px;border-top:1px solid var(--line)}

.plan{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.heat{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}

.goal{display:flex;align-items:center;gap:8px}
.goal .gbar{flex:1;height:8px;border-radius:9px;background:var(--band-soft);overflow:hidden} .goal .gbar i{display:block;height:100%;background:#5CC484}
/* study */
.study{flex:1;display:flex;flex-direction:column;width:100%;max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:env(safe-area-inset-top,0px)}
.shead{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--paper);display:flex;align-items:center;gap:8px;padding-block:10px}
.prog{flex:1;height:6px;border-radius:9px;background:var(--soft);overflow:hidden} .prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.face{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px -18px rgba(10,20,50,.45);overflow:hidden;margin-top:4px}
.face .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 14px 0 18px;font-size:.78rem;color:var(--muted)}
.face .q{padding:14px 18px 16px;border-bottom:2px solid var(--rule);font-size:calc(1.16rem * var(--fs));line-height:1.45;font-weight:700}
.face .a{padding:14px 18px 18px;background-image:repeating-linear-gradient(transparent 0 31px,var(--soft) 31px 32px);background-position:0 12px;line-height:2rem;font-size:calc(1.04rem * var(--fs));overflow-wrap:anywhere}
.face .a.hidden{display:grid;place-items:center;min-height:150px;color:var(--muted);background:none;line-height:1.4;text-align:center;cursor:pointer}
.recall{font:700 .72rem var(--mono);padding:3px 7px;border-radius:999px;border:1.5px solid currentColor}
.star{border:0;background:none;font-size:1.2rem;color:var(--muted);min-width:40px;min-height:40px}
.star[aria-pressed="true"]{color:#E9BC22}
.xpl{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--soft);line-height:1.5;font-size:calc(.97rem * var(--fs))}
.xpl .eyebrow{display:block;margin-bottom:6px}
.note{display:flex;align-items:center;gap:8px;margin-top:10px;padding:10px 14px;border-radius:12px;border:1px dashed var(--line);color:var(--ink);text-decoration:none;font-size:.92rem}
.verdict{display:flex;align-items:center;gap:8px;font-weight:700;padding:10px 14px;border-radius:12px;margin-top:12px}
.verdict.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.verdict.no{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.cmdbox{width:100%;min-height:52px;margin-top:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:12px 14px;font:calc(.95rem * var(--fs)) var(--mono)}
.diff{font:calc(.92rem * var(--fs))/1.7 var(--mono);overflow-wrap:anywhere} .diff .bad{background:color-mix(in srgb,var(--bad) 22%,transparent);border-radius:4px;padding:0 2px} .diff .miss{color:var(--bad);text-decoration:underline}
.dock{position:sticky;bottom:0;background:var(--paper);padding-block:10px calc(12px + env(safe-area-inset-bottom,0px));margin-top:auto;z-index:4}
.ask{text-align:center;font-weight:700;font-size:.9rem;margin-bottom:8px}
.rate{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;justify-items:center}
.rate div{display:flex;flex-direction:column;align-items:center;gap:4px}
.rate button{width:min(64px,16vw);aspect-ratio:1;border-radius:50%;border:0;color:#fff;font:700 1.35rem var(--display);box-shadow:0 4px 0 rgba(0,0,0,.12)}
.rate button:active{transform:translateY(2px);box-shadow:none}
.rate small{font:600 .7rem var(--mono);color:var(--muted)}
.rate .r1{background:var(--c1)}.rate .r2{background:var(--c2)}.rate .r3{background:var(--c3)}.rate .r4{background:var(--c4)}.rate .r5{background:var(--c5)}
.ratelbl{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);margin-top:4px;padding:0 4px}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px} .tf .btn{min-height:56px;border-radius:14px}

.timer{font:700 1rem var(--mono);font-variant-numeric:tabular-nums;padding:6px 10px;border-radius:10px;background:var(--card);border:1px solid var(--line)}

.search{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--paper);padding-block:10px 8px}
.search input{width:100%;min-height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);padding:0 16px;font-size:1.05rem}
.filters{display:flex;gap:6px;overflow-x:auto;padding-top:8px;scrollbar-width:none}

mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}

.field{display:flex;flex-direction:column;gap:6px}

.levels{display:flex;gap:8px;flex-wrap:wrap}

.levels input{width:18px;height:18px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
.chart{display:flex;align-items:flex-end;gap:4px;height:120px;padding-top:8px}

<script>

function vToday() {

// ================================================================ study sessions
function interleave(cards) { const by = {}; cards.forEach(c => (by[c.t] = by[c.t] || []).push(c)); const lists = shuffle(Object.values(by)); const out = []; let i = 0; while (lists.some(l => l.length)) { const l = lists[i % lists.length]; if (l.length) out.push(l.shift()); i++; } return out; }
const mixWeight = g => { const m = settings().mix[g]; const base = m == null ? 100 : m; return base * ({exam: 2, active: 1, maintain: 0.5, paused: 0}[statusOf(g)] || 1); };
function weightedMix(byGroup) {
  const keys = Object.keys(byGroup).filter(k => byGroup[k].length && mixWeight(k) > 0); const credit = {}; keys.forEach(k => credit[k] = 0); const out = [];
  while (keys.some(k => byGroup[k].length)) { let best = null; let total = 0; for (const k of keys) if (byGroup[k].length) { credit[k] += mixWeight(k); total += mixWeight(k); if (!best || credit[k] > credit[best]) best = k; } credit[best] -= total; out.push(byGroup[best].shift()); }
  return out;
}
function buildQueue(cards, mode) {
  const t = now();
  if (mode === "drill" || mode === "list") return cards.slice();
  const overByG = {}; cards.filter(c => isDue(c, t)).sort((a, b) => S.progress[a.id].d - S.progress[b.id].d).forEach(c => (overByG[c.g] = overByG[c.g] || []).push(c));
  const freshByG = {};
  cards.filter(c => !S.progress[c.id]).forEach(c => (freshByG[c.g] = freshByG[c.g] || []).push(c));
  for (const g in freshByG) { const ord = settings().order[g] || "random"; freshByG[g] = (ord === "progressive" ? freshByG[g] : interleave(freshByG[g])).slice(0, newLeft(g)); }
  const over = Object.keys(overByG).length > 1 ? weightedMix(overByG) : (Object.values(overByG)[0] || []);
  const fresh = Object.keys(freshByG).length > 1 ? weightedMix(freshByG) : (Object.values(freshByG)[0] || []);
  const q = []; let i = 0, j = 0;
  while (i < over.length || j < fresh.length) { for (let k = 0; k < 3 && i < over.length; k++) q.push(over[i++]); if (j < fresh.length) q.push(fresh[j++]); }
  return q;
}
function startStudy(cards, mode, label, scope) {
  const q = buildQueue(cards, mode);
  const back = view.name === "caught" || view.name === "check" ? (session && session.back) : view;

  const qv = view.q || "", gf = view.gf || "all", lv = view.lv || [], fl = view.fl || [], words = fold(qv).split(/\s+/).filter(Boolean), t = now();
  const filtering = words.length || lv.length || fl.length || gf !== "all";
  let hits = [];
  if (filtering) for (const c of CARDS) {
    if (gf !== "all" && c.g !== gf) continue;
    if (lv.length && !lv.includes(confOf(c.id))) continue;
    if (fl.includes("bm") && !(S.meta.bm[c.id] && S.meta.bm[c.id].v)) continue;
    if (fl.includes("over") && !isDue(c, t)) continue;
    if (fl.includes("nox") && c.x) continue;
    if (fl.includes("edited") && !c.edited && !c.mine) continue;
    if (fl.includes("cmd") && !c.cmd) continue;
    if (words.length) { const hay = fold(c.q + " " + c.a + " " + (c.x || "") + " " + (c.cmd || "") + " " + (c.tags || []).join(" ") + " " + TOPICS[c.t].title); if (!words.every(w => hay.includes(w))) continue; }
    hits.push(c); if (hits.length >= 150) break;
  }
  lastHits = hits;
  return `<main class="col" style="padding-top:env(safe-area-inset-top,0px)"><div class="search"><input id="q" type="search" placeholder="Search questions, answers, explanations" value="${esc(qv)}" autocomplete="off" enterkeyhint="search" aria-label="Search cards">
  <div class="filters" aria-label="Subject">${[["all", "All"]].concat(DECK.groups.map(g => [g.id, g.title])).map(([k, l]) => `<button data-act="gf" data-v="${k}" aria-pressed="${gf === k}">${l}</button>`).join("")}</div>
  <div class="filters" aria-label="Last rating">${[0, 1, 2, 3, 4, 5].map(k => `<button data-act="lv" data-v="${k}" aria-pressed="${lv.includes(k)}"><span class="dot" style="background:var(--c${k})"></span>${k === 0 ? "New" : k}</button>`).join("")}${FLAGS.map(([k, l]) => `<button data-act="fl" data-v="${k}" aria-pressed="${fl.includes(k)}">${l}</button>`).join("")}</div></div>
  <div class="stack" style="gap:8px">${!filtering ? `<p class="muted">Type a word or two, or pick filters: e.g. <i>bresenham</i>, <i>sigmoid derivative</i>, rated 1–2 in GRK, or BSI commands.</p>` : hits.length ? `<div class="row between"><span class="small muted num">${hits.length >= 150 ? "First 150 matches" : plural(hits.length, "match").replace("matchs", "matches")}</span><button class="btn sm" data-act="studyHits">Study these</button></div>` + listCards(hits, words) : `<p class="muted">No cards match.</p>`}</div></main>` + tabs("search");
}

// ================================================================ Progress
function vProgress() {
  const d = today(), days = []; for (let k = 13; k >= 0; k--) days.push(Object.assign({d: d - k}, dayTotals(d - k)));
  const mx = Math.max(1, ...days.map(x => x.n)), t = now();
  const fc = []; for (let k = 0; k < 7; k++) { const end = dayStartMs(d + k + 1), start = k === 0 ? -Infinity : end - DAY; let n = 0; for (const c of CARDS) { const s = S.progress[c.id]; if (s && s.d < end && s.d >= start) n++; } fc.push({d: d + k, n}); }
  const fx = Math.max(1, ...fc.map(x => x.n)), L = levels(CARDS), seen = CARDS.length - L[0];
  const tot = days.reduce((s, x) => s + x.n, 0), good = days.reduce((s, x) => s + x.g, 0), week = days.slice(-7).reduce((s, x) => s + x.ms, 0);
  const dated = []; for (const g of Object.keys(GROUPS)) for (const tt of testsOf(g)) if (tt.date && dayOf(tt.date) >= d) { const set = new Set(tt.topics), cs = (BYGROUP[g] || []).filter(c => set.has(c.t)); dated.push({g, tt, day: dayOf(tt.date), m: mastery(cs), unseen: cs.filter(c => !S.progress[c.id]).length, n: cs.length}); }
  dated.sort((a, b) => a.day - b.day);
  const tests = S.tests.slice(-12).reverse();
  return `<header class="band"><div class="col">${bandTop()}<div class="hello">Progress</div><div class="kpis"><div class="kpi"><span>Recall (14 d)</span><b>${tot ? Math.round(good / tot * 100) : 0}%</b></div><div class="kpi"><span>Target</span><b>${Math.round(settings().retention * 100)}%</b></div><div class="kpi"><span>Min this week</span><b>${Math.round(week / 60000)}</b></div></div></div></header><main class="col">
  ${dated.length ? `<div class="section"><div class="eyebrow">Ready for each test</div>${dated.map(x => `<div class="panel stack" style="gap:6px"><div class="row between"><b>${esc(GROUPS[x.g].title)} ${esc(x.tt.title)} · ${fmtDate(x.day)}</b><span class="num">${Math.round(x.m * 100)}%</span></div><div class="cbar"><i style="width:${x.m * 100}%;background:var(--accent)"></i></div><div class="small muted">${x.n} cards · ${x.unseen} not seen yet · ${x.day - d} days left</div></div>`).join("")}</div>` : ""}
  <div class="section"><div class="eyebrow">Cards per day · last 14 days</div><div class="panel"><div class="chart">${days.map(x => `<div title="${isoOf(x.d)}: ${x.n} cards, ${Math.round(x.ms / 60000)} min"><span>${x.n || ""}</span><i style="height:${x.n / mx * 100}%"></i><span>${isoOf(x.d).slice(8)}</span></div>`).join("")}</div></div></div>
  <div class="section"><div class="eyebrow">Coming due · next 7 days</div><div class="panel"><div class="chart">${fc.map((x, k) => `<div><span>${x.n || ""}</span><i style="height:${x.n / fx * 100}%;background:var(--c5)"></i><span>${k === 0 ? "now" : new Date(x.d * DAY).toLocaleDateString("en-GB", {weekday: "short", timeZone: "UTC"})}</span></div>`).join("")}</div></div></div>
  <div class="section"><div class="eyebrow">Confidence of all cards</div><div class="panel stack" style="align-items:center">${ring(L, 180, (mastery(CARDS) * 100).toFixed(1) + "%", "Mastery")}<div class="row small muted num" style="justify-content:center">${[0, 1, 2, 3, 4, 5].map(k => `<span><span class="dot" style="background:var(--c${k})"></span> ${k === 0 ? "new" : k}: ${L[k]}</span>`).join("")}</div><div class="small muted">${seen} of ${CARDS.length} cards started</div></div></div>
  <div class="section"><div class="eyebrow">By subject</div><div class="panel tablewrap"><table><thead><tr><th>Subject</th><th class="n">Mastery</th><th class="n">Started</th><th class="n">Overdue</th><th class="n">Recall now</th></tr></thead><tbody>${DECK.groups.map(g => { const cs = BYGROUP[g.id] || [], c = counts(cs), st = cs.filter(x => S.progress[x.id]); const rn = st.length ? st.reduce((a, x) => a + recallOf(x), 0) / st.length : null; return `<tr><td><b>${esc(g.title)}</b> <span class="muted small">${esc(g.name)}</span></td><td class="n">${(c.m * 100).toFixed(1)}%</td><td class="n">${c.seen}/${c.n}</td><td class="n">${c.over}</td><td class="n">${rn === null ? "—" : Math.round(rn * 100) + "%"}</td></tr>`; }).join("")}</tbody></table></div><p class="small muted">Mastery = average of your latest 1–5 ratings (unseen cards count 0), as in Brainscape. Recall now = the memory model's estimate of what you'd remember today. Recall (14 d) = share of your ratings that were 3 or higher.</p></div>
  <div class="section"><div class="eyebrow">Tests & exams</div>${tests.length ? `<div class="panel tablewrap"><table><thead><tr><th>Date</th><th>Test</th><th class="n">Score</th><th class="n">Time</th></tr></thead><tbody>${tests.map(x => `<tr><td class="num">${new Date(x.ts).toLocaleDateString("en-GB", {day: "numeric", month: "short"})}</td><td>${esc(GROUPS[x.g] ? GROUPS[x.g].title : x.g)} ${esc(x.title)}</td><td class="n">${x.right}/${x.n}${x.pts ? ` <span class="muted">(${(x.right / x.n * x.pts).toFixed(1)}/${x.pts})</span>` : ""}</td><td class="n">${fmtTime(x.secs)}</td></tr>`).join("")}</tbody></table></div>` : `<p class="muted">No tests yet. Start one from a subject's Tests tab.</p>`}</div></main>` + tabs("progress");
}

  <label class="toggle"><span><b>Exam planner</b><br><span class="small muted">Sees every card of a dated test 3 days early, keeps 4s and 5s due before it, and shows each card once more in the last 3 days.</span></span><input type="checkbox" data-setb="planner" ${s.planner ? "checked" : ""}></label>
  <div class="field"><label>Test questions</label>${seg("qstyle", [["auto", "Auto"], ["self", "Self-check only"]])}</div></div></div>
  <div class="section"><div class="eyebrow">Subjects</div><div class="panel" style="padding:4px 14px">${DECK.titles.flatMap(T => T.groups).filter(g => GROUPS[g]).map(g => `<div class="topic" style="grid-template-columns:auto 1fr auto"><span class="code" style="width:42px;height:42px">${esc(GROUPS[g].title)}</span><span class="small">${esc(GROUPS[g].name)}<br><button class="tbtn" style="padding:0;min-height:30px" data-act="testsEditor" data-g="${g}">Tests & dates (${testsOf(g).filter(t => t.date).length} dated)</button></span><button class="pill ${statusOf(g)}" data-act="statusSheet" data-g="${g}" style="border:0">${STATUS[statusOf(g)]}</button></div>`).join("")}</div><button class="btn block" data-act="mixSheet">Study mix sliders</button></div>
  <div class="section"><div class="eyebrow">Studying</div><div class="panel"><label class="toggle"><span><b>Type the answer before revealing</b></span><input type="checkbox" data-setb="typeAnswer" ${s.typeAnswer ? "checked" : ""}></label><label class="toggle"><span><b>Reverse cards</b></span><input type="checkbox" data-setb="reverse" ${s.reverse ? "checked" : ""}></label><div class="toggle"><span><b>Font size</b></span><span class="row"><button class="icon-btn" data-act="font" data-v="-1" aria-label="Smaller">A−</button><span class="num">${s.font}</span><button class="icon-btn" data-act="font" data-v="1" aria-label="Bigger">A+</button></span></div></div></div>
  <div class="section"><div class="eyebrow">Account & data</div><div class="panel stack"><p class="small muted">Your progress is saved on this device at once and synced to your Neon database. It works offline and catches up later.</p>
  <div class="row" style="gap:8px"><button class="btn grow" data-act="syncNow">Sync now</button><button class="btn grow" data-act="export">Copy a backup</button></div><button class="btn ghost block" data-act="resetAsk" style="color:var(--bad)">Reset a subject's progress…</button><button class="btn block" data-act="logout">Sign out</button></div></div>
  <div class="section"><div class="eyebrow">Keys on a keyboard</div><div class="panel small">Space = show answer · 1–5 = rate · T / F = true or false · U = undo · S = bookmark · E = edit · / = search</div><p class="small muted">Deck ${esc(DECK.version)} · ${CARDS.length} cards.</p></div></main>` + tabs("");
}

// ================================================================ events
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, ds = el.dataset;
  if (act === "closeSheet" && el.classList.contains("scrim") && e.target !== el) return;
  const set = (k, v) => { S.meta.settings[k] = v; S.meta.settings.u = now(); markMeta(); };
  switch (act) {
    case "tab": session = null; closeSheet(); go(ds.gf ? {name: "search", gf: ds.gf} : {name: ds.v}); break;
    case "gtab": view.tab = ds.v; render(); break;
    case "group": closeSheet(); go({name: "group", g: ds.g}); break;
    case "topic": go({name: "topic", t: ds.t}); break;
    case "toggleTopic": { const s = selected(ds.g); el.checked ? s.add(ds.t) : s.delete(ds.t); render(); break; }
    case "selToggleAll": sel[ds.g] = el.checked ? new Set(GROUPS[ds.g].topics.map(t => t.id)) : new Set(); render(); break;
    case "order": { const o = Object.assign({}, settings().order); o[ds.g] = ds.v; set("order", o); render(); break; }
    case "study": startStudy(cardsOfTopics(selected(ds.g)), "srs", GROUPS[ds.g].title + " · study"); break;
    case "studyGroup": startStudy((BYGROUP[ds.g] || []).filter(c => c.t !== "grk-info"), "srs", GROUPS[ds.g].title + " · today"); break;
    case "studyPlan": case "studyPlanClose": closeSheet(); startStudy(CARDS.filter(c => statusOf(c.g) !== "paused" && c.t !== "grk-info"), "srs", "Today's plan"); break;
    case "studyBm": startStudy(bookmarked(), "list", "Bookmarked"); break;
    case "studyHits": startStudy(lastHits, "list", "Search results"); break;
    case "studyTopic": startStudy(BYTOPIC[ds.t] || [], "srs", TOPICS[ds.t].title); break;
    case "studyOne": closeSheet(); startStudy([BYID[ds.id]], "list", "One card"); break;
    case "studyMissed": startStudy(quiz.result.missed.map(id => BYID[id]).filter(Boolean), "list", "Missed in " + quiz.title); break;
    case "studyWeak": { const ids = session.q.filter((id, i, a) => a.indexOf(id) === i && confOf(id) > 0 && confOf(id) <= 2); startStudy(ids.map(id => BYID[id]), "list", "Rated 1–2 in the drill"); break; }
    case "anyway": { const scope = session.scope.map(id => BYID[id]).filter(Boolean); const pick = scope.slice().sort((a, b) => (confOf(a.id) - confOf(b.id)) || ((S.progress[a.id] ? S.progress[a.id].d : 0) - (S.progress[b.id] ? S.progress[b.id].d : 0))).slice(0, settings().round); startStudy(pick, "list", session.label, scope); break; }
    case "reveal": reveal(); break;
    case "cmdCheck": cmdCheck(); break;
    case "tf": session.tfPick = +ds.v; reveal(); break;
    case "rate": rate(+ds.n); break;
    case "undo": undo(); break;
    case "continue": go({name: "study"}); break;
    case "endStudy": { const back = session && session.back; session = null; undoBuf = null; go(back && !["study", "check", "caught", "boot", "login"].includes(back.name) ? back : {name: "today"}); scheduleSync(300); break; }
    case "studyMenu": studyMenu(); break;
    case "font": set("font", clamp((settings().font || 0) + (+ds.v), 0, 3)); render(); if (layer.innerHTML) studyMenu(); break;
    case "intervals": intervalsSheet(); break;
    case "preset": set("preset", ds.v); intervalsSheet(); break;
    case "bm": { const cur = S.meta.bm[ds.id] && S.meta.bm[ds.id].v; S.meta.bm[ds.id] = {v: cur ? 0 : 1, u: now()}; markMeta(); if (layer.innerHTML) cardSheet(ds.id); else render(); break; }
    case "mixSheet": mixSheet(); break;
    case "mixReset": set("mix", {}); mixSheet(); break;
    case "statusSheet": statusSheet(ds.g); break;
    case "setStatus": { const st = Object.assign({}, settings().status); st[ds.g] = ds.v; set("status", st); closeSheet(); render(); toast(GROUPS[ds.g].title + ": " + STATUS[ds.v]); break; }
    case "drillSheet": drillSheet(ds.g); break;
    case "drillGo": { const lv = new Set([...layer.querySelectorAll("[data-lvl]")].filter(x => x.checked).map(x => +x.dataset.lvl)); const cs = shuffle(cardsOfTopics(selected(ds.g)).filter(c => lv.has(confOf(c.id)))); closeSheet(); if (!cs.length) return toast("No cards with those ratings"); startStudy(cs, "drill", GROUPS[ds.g].title + " · drill"); break; }
    case "startTest": { const t = testsOf(ds.g).find(x => x.id === ds.t); buildQuiz(ds.g, t.title, t.kind, t.topics, t.n, t.min, ds.g === "grk" ? (t.kind === "exam" ? 70 : 15) : null); break; }
    case "customTest": testSheet(ds.g); break;
    case "testsEditor": testsEditor(ds.g); break;
    case "testAdd": { const list = readTestsForm(ds.g); list.push({id: ds.g + "-c" + now().toString(36), kind: "test", title: "New test", date: null, n: 20, min: 30, note: "", topics: GROUPS[ds.g].topics.map(t => t.id)}); S.meta.settings.tests = Object.assign({}, settings().tests, {[ds.g]: list}); S.meta.settings.u = now(); markMeta(); testsEditor(ds.g); break; }
    case "testDel": { const list = readTestsForm(ds.g); list.splice(+ds.i, 1); S.meta.settings.tests = Object.assign({}, settings().tests, {[ds.g]: list}); S.meta.settings.u = now(); markMeta(); testsEditor(ds.g); break; }
    case "seg": el.parentElement.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b === el)); break;
    case "ans": if (quiz.feedback && quiz.ans[quiz.i] !== null) break; quiz.ans[quiz.i] = +ds.v; render(); break;
    case "qcmd": { const i = document.getElementById("qcmd"); quiz.typed[quiz.i] = i ? i.value.trim() : ""; quiz.ans[quiz.i] = cmdCompare(BYID[quiz.qs[quiz.i].id].cmd, quiz.typed[quiz.i]).ok ? 1 : 0; render(); break; }
    case "qreveal": quiz.revealed = true; render(); break;
    case "qnext": quiz.i++; quiz.revealed = false; render(); window.scrollTo(0, 0); break;
    case "qprev": quiz.i--; quiz.revealed = false; render(); break;
    case "finish": finishQuiz(); break;
    case "quitTest": openSheet(`<div class="stack"><h2>Finish now?</h2><p class="muted">Unanswered questions count as wrong.</p><button class="btn primary block" data-act="finishNow">Finish and see results</button><button class="btn block" data-act="abandon">Leave without saving</button><button class="btn ghost block" data-act="closeSheet">Keep going</button></div>`); break;
    case "finishNow": closeSheet(); finishQuiz(); break;
    case "abandon": closeSheet(); clearInterval(tick); quiz = null; go({name: "today"}); break;
    case "gf": view.gf = ds.v; view.focus = false; render(); break;
    case "lv": { const v = +ds.v, l = (view.lv || []).slice(); const i = l.indexOf(v); i >= 0 ? l.splice(i, 1) : l.push(v); view.lv = l; view.focus = false; render(); break; }
    case "fl": { const l = (view.fl || []).slice(); const i = l.indexOf(ds.v); i >= 0 ? l.splice(i, 1) : l.push(ds.v); view.fl = l; view.focus = false; render(); break; }
    case "card": cardSheet(ds.id); break;
    case "edit": editSheet(ds.id); break;
    case "addCard": addSheet(ds.g); break;
    case "resetEdit": S.meta.edits[ds.id] = {u: now()}; afterEdit("Back to the original text"); break;
    case "delCard": S.meta.custom[ds.id] = Object.assign({}, S.meta.custom[ds.id], {del: 1, u: now()}); afterEdit("Card deleted"); break;
    case "resetCard": delete S.progress[ds.id]; markDirty(ds.id); closeSheet(); toast("Card reset"); render(); break;
    case "closeSheet": closeSheet(); if (view.name === "study") render(); break;
    case "set": { const k = ds.k; set(k, typeof DEFAULT_SETTINGS[k] === "number" ? +ds.v : ds.v); render(); break; }
    case "syncNow": sync(); break;
    case "export": { const body = JSON.stringify({recall: 3, exported: new Date().toISOString(), progress: S.progress, meta: S.meta, tests: S.tests}); (navigator.clipboard ? navigator.clipboard.writeText(body) : Promise.reject()).then(() => toast("Backup copied — paste it into a note"), () => toast("Couldn't copy here")); break; }
    case "resetAsk": openSheet(`<div class="stack"><h2>Reset progress</h2><p class="muted">Clears your ratings and schedule for one subject, on every device. Cards, edits and test history stay.</p>${DECK.groups.map(g => `<button class="btn block" data-act="resetG" data-g="${g.id}">Reset ${esc(g.title)} · ${esc(g.name)}</button>`).join("")}<button class="btn ghost block" data-act="closeSheet">Cancel</button></div>`); break;
    case "resetG": { for (const c of BYGROUP[ds.g] || []) if (S.progress[c.id]) { delete S.progress[c.id]; markDirty(c.id); } closeSheet(); toast(GROUPS[ds.g].title + " progress reset"); render(); break; }
    case "logout": relay("/signout", {session: S.session}).catch(() => {}); IDB.del("state"); S = blankState(); JWT = null; go({name: "login"}); break;
    case "google": googleStart(el); break;
    case "loginMode": view = {name: "login", mode: view.mode === "signup" ? "signin" : "signup"}; render(); break;
  }
});
function afterEdit(msg) { markMeta(); indexDeck(); closeSheet(); toast(msg); render(); }
document.addEventListener("input", e => {
  if (e.target.id === "q") { clearTimeout(window._st); const v = e.target.value; window._st = setTimeout(() => { view.q = v; view.focus = true; render(); }, 180); }
  if ((e.target.id === "typed" || e.target.id === "cmdIn") && session) session.typed = e.target.value;
  if (e.target.dataset.mix) { const m = Object.assign({}, settings().mix); m[e.target.dataset.mix] = +e.target.value; S.meta.settings.mix = m; S.meta.settings.u = now(); document.getElementById("mx-" + e.target.dataset.mix).textContent = e.target.value + "%"; markMeta(); }
});
document.addEventListener("change", e => {
  if (e.target.dataset.setb) { S.meta.settings[e.target.dataset.setb] = e.target.checked; S.meta.settings.u = now(); markMeta(); }
  if (e.target.dataset.custom) { const c = settings().custom.slice(); c[+e.target.dataset.custom] = Math.max(1, +e.target.value || 1); S.meta.settings.custom = c; S.meta.settings.u = now(); markMeta(); intervalsSheet(); }
});
document.addEventListener("submit", async e => {
  e.preventDefault(); const f = e.target;
  if (f.id === "loginForm") {
    const email = f.querySelector("#le").value.trim().toLowerCase(), pw = f.querySelector("#lp").value, signup = view.mode === "signup";
    const btn = f.querySelector("button[type=submit]"); btn.disabled = true; btn.textContent = signup ? "Creating…" : "Signing in…";
    try {
      takeLogin(await relay(signup ? "/signup" : "/signin", signup ? {email, password: pw, name: email.split("@")[0]} : {email, password: pw}));
      view = {name: "boot"}; render(); await sync();
      if (DECK && S.session) go({name: "today"});
    } catch (err) { view = Object.assign({}, view, {email, err: signup ? (err.status === 422 || err.status === 400 ? "Can't create this account: " + err.message : err.message) : (err.status === 401 ? "Wrong email or password." : "Can't reach the login service — " + err.message)}); render(); }
  } else if (f.id === "editForm") {
    const id = f.dataset.id, c = BYID[id], a = f.querySelector("#ea").value.trim(), x = f.querySelector("#ex").value.trim();
    if (c.mine) S.meta.custom[id] = Object.assign({}, S.meta.custom[id], {q: f.querySelector("#eq").value.trim(), a, x, u: now()});
    else { const orig = DECK.cards.find(o => o.id === id); const ed = {u: now()}; if (a !== orig.a) ed.a = a; if (x !== (orig.x || "")) ed.x = x; S.meta.edits[id] = ed; }
    afterEdit("Saved");
  } else if (f.id === "addForm") {
    const g = f.dataset.g, id = g + "-u" + now().toString(36), tf = f.querySelector("#atf").value;
    const c = {g, t: f.querySelector("#at").value, q: f.querySelector("#aq").value.trim(), a: f.querySelector("#aa").value.trim(), x: f.querySelector("#ax").value.trim(), u: now()};
    if (tf === "cmd") c.cmd = c.a.replace(/^`|`$/g, ""); else if (tf !== "") c.tf = +tf;
    if (!c.q || !c.a) return toast("Fill in a question and an answer");
    S.meta.custom[id] = c; afterEdit("Card added");
  } else if (f.id === "testForm") {
    const g = f.dataset.g, n = +f.querySelector("#tn").value || 20, m = +f.querySelector("#tm").value || 20, kind = f.querySelector('[data-act="seg"][aria-pressed="true"]').dataset.v;
    closeSheet(); buildQuiz(g, kind === "exam" ? "Custom exam" : "Custom test", kind, [...selected(g)], n, m, null);
  } else if (f.id === "testsForm") {
    const g = f.dataset.g, list = readTestsForm(g);
    S.meta.settings.tests = Object.assign({}, settings().tests, {[g]: list}); S.meta.settings.u = now(); markMeta(); closeSheet(); render(); toast("Tests saved");
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && layer.innerHTML) return closeSheet();
  if (e.target.id === "cmdIn" && e.key === "Enter") { e.preventDefault(); return cmdCheck(); }
  if (e.target.id === "qcmd" && e.key === "Enter") { e.preventDefault(); return document.querySelector('[data-act="qcmd"]').click(); }
  if (e.target.matches && e.target.matches("input,textarea,select")) return;
  if (e.key === "/" && !["study", "test"].includes(view.name)) { e.preventDefault(); return go({name: "search", focus: true}); }
  if (view.name === "study" && session && !layer.innerHTML) {
    const c = curCard(); if (!c) return;
    if (!session.revealed) { if (c.tf != null && (e.key === "t" || e.key === "f")) { session.tfPick = e.key === "t" ? 1 : 0; reveal(); } else if (c.tf == null && (e.key === " " || e.key === "Enter")) { e.preventDefault(); reveal(); } }
    else if (/^[1-5]$/.test(e.key)) rate(+e.key);
    if (e.key === "u" || ((e.metaKey || e.ctrlKey) && e.key === "z")) undo();
    if (e.key === "s") document.querySelector('.face [data-act="bm"]').click();
    if (e.key === "e") editSheet(c.id);
  }
});
// ================================================================ Google sign-in
// Neon only offers the redirect flow: the relay starts it and hands back a short-lived challenge,
// Google returns here with ?neon_auth_session_verifier=…, and the relay swaps both for a session.
const VERIFIER = "neon_auth_session_verifier";
async function googleStart(btn) {
  btn.disabled = true;
  try {
    const d = await relay("/google/start", {callbackURL: location.origin + location.pathname});
    try { sessionStorage.setItem("recall.gch", d.challenge); localStorage.setItem("recall.gch", d.challenge); } catch (e) {}
    location.href = d.url;
  } catch (e) { btn.disabled = false; view = Object.assign({}, view, {err: "Google sign-in isn't available right now — " + e.message}); render(); }
}
async function googleFinish() {
  const q = new URLSearchParams(location.search), v = q.get(VERIFIER);
  if (!v) return false;
  let ch = null; try { ch = sessionStorage.getItem("recall.gch") || localStorage.getItem("recall.gch"); sessionStorage.removeItem("recall.gch"); localStorage.removeItem("recall.gch"); } catch (e) {}
  q.delete(VERIFIER); history.replaceState(null, "", location.pathname + (q.toString() ? "?" + q : "") + location.hash);
  if (!ch) { view = {name: "login", err: "Google sign-in took too long. Try again."}; render(); return true; }
  try { takeLogin(await relay("/google/finish", {verifier: v, challenge: ch})); return true; }
  catch (e) { view = {name: "login", err: e.status === 401 ? "Google sign-in expired. Try again." : "Google sign-in failed — " + e.message}; render(); return true; }
}

// ================================================================ boot
(async () => {
  const saved = await IDB.get("state");
  if (saved && saved.session) { S = Object.assign(blankState(), saved); S.meta.settings = Object.assign({}, DEFAULT_SETTINGS, S.meta.settings || {}); ["edits", "custom", "bm", "days"].forEach(k => S.meta[k] = S.meta[k] || {}); }
  DECK = await IDB.get("deck");
  const fromGoogle = await googleFinish();
  if (fromGoogle && !S.session) return;
  if (!S.session) { view = {name: "login"}; return render(); }
  if (DECK) { indexDeck(); view = {name: "today"}; render(); }
  await sync();
  if (!S.session) return;
  if (!DECK) { view = {name: "login", err: "Couldn't load your cards. Check the connection and sign in again."}; return render(); }
  if (view.name === "boot") go({name: "today"});
})();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
