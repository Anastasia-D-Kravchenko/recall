<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Recall</title>
<meta name="theme-color" content="#162240">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Recall">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Familjen+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
/* Layout: navy header bands, one 760px column on phones (sidebar on wide screens). Home = map of subjects → topics with
   progress; topic pages with Learn / Slides / Listen / Videos / Cards / Ask; study screen with a thumb-zone rating dock. */
:root{
  --band:#162240; --band-ink:#FFFFFF; --band-soft:#22335C; --band-muted:#AFC0E2;
  --paper:#EEF1F6; --card:#FFFFFF; --ink:#15203A; --muted:#5A6479; --line:#D9DFEA; --soft:#E5EAF2;
  --accent:#2E9FD8; --accent-ink:#FFFFFF; --accent-soft:#DDF0FA; --rule:#E9A3A3; --mark:#FFE58A;
  --ok:#2F8F55; --bad:#C83E3A; --warn:#B7791F; --c0:#C3CBD9;
  --tile:#162240; --c1:#A12D86; --c2:#F28B30; --c3:#E9BC22; --c4:#6FAA36; --c5:#2E9FD8;
  --display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --fs:1;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --band:#0F1830; --band-soft:#1B2848; --band-muted:#93A6CC;
  --paper:#0B1222; --card:#16203A; --ink:#E6EBF4; --muted:#98A3BA; --line:#26324E; --soft:#1D2944;
  --accent:#45B2E6; --accent-ink:#0B1222; --accent-soft:#163650; --rule:#7A3A3A; --mark:#5E5214;
  --ok:#5CC484; --bad:#F07067; --warn:#E3B04B; --c0:#3A4766; --tile:#2A3B66; color-scheme:dark}}
:root[data-theme="dark"]{
  --band:#0F1830; --band-soft:#1B2848; --band-muted:#93A6CC;
  --paper:#0B1222; --card:#16203A; --ink:#E6EBF4; --muted:#98A3BA; --line:#26324E; --soft:#1D2944;
  --accent:#45B2E6; --accent-ink:#0B1222; --accent-soft:#163650; --rule:#7A3A3A; --mark:#5E5214;
  --ok:#5CC484; --bad:#F07067; --warn:#E3B04B; --c0:#3A4766; --tile:#2A3B66; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.5 var(--body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
#app{min-height:100%;display:flex;flex-direction:column}
.col{width:100%;max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:1.6rem;font-weight:700} h2{font-size:1.2rem;font-weight:700} h3{font-size:1rem;font-weight:600}
.eyebrow{font:700 .72rem/1 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:.86rem} .num{font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .between{justify-content:space-between} .grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.section{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:700;text-decoration:none;color:inherit}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);letter-spacing:.05em;text-transform:uppercase}
.btn.ghost{background:transparent;border-color:transparent}
.btn.block{width:100%} .btn.sm{min-height:36px;padding:0 13px;font-size:.86rem}
.btn:disabled{opacity:.45;cursor:default}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:inline-grid;place-items:center;font-size:1.05rem;flex:none;color:inherit;text-decoration:none}
.chip{font:600 .72rem/1 var(--mono);padding:4px 6px;border-radius:6px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--soft);font-size:.76rem;font-weight:700;white-space:nowrap;border:0}
.pill.exam{background:color-mix(in srgb,var(--c1) 18%,transparent);color:var(--c1)}
.pill.active{background:var(--accent-soft);color:var(--accent)}
.pill.maintain{background:var(--soft);color:var(--muted)}
.pill.paused{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.cbar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--c0)} .cbar i{display:block;height:100%}
.band{background:var(--band);color:var(--band-ink);padding-top:env(safe-area-inset-top,0px)}
.band .col{padding-block:12px 18px}
.bandtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font:700 1.05rem var(--display)} .brand img{width:30px;height:30px;border-radius:8px}
.sync{font-size:.75rem;color:var(--band-muted);display:flex;align-items:center;gap:6px;background:none;border:0;padding:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--band-muted)}
.sync[data-s="synced"] i{background:#5CC484} .sync[data-s="syncing"] i{background:#E9BC22} .sync[data-s="error"] i,.sync[data-s="offline"] i{background:#F07067}
.band .icon-btn{background:var(--band-soft);border-color:transparent;color:var(--band-ink)}
.band .btn:not(.primary){background:var(--band-soft);color:#fff;border-color:transparent}
.hello{font:700 1.45rem/1.15 var(--display);margin-top:10px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.kpi span{display:block;font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--band-muted)}
.kpi b{font:700 1.3rem/1.1 var(--display);font-variant-numeric:tabular-nums}
.studybar{display:flex;gap:10px;align-items:center;margin-top:14px} .studybar .btn.primary{flex:1;min-height:50px}
.back{color:var(--band-muted);background:none;border:0;padding:0;font-weight:700;min-height:36px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--card);border-top:1px solid var(--line);padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.tabs nav{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{border:0;background:none;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.74rem;font-weight:700;color:var(--muted)}
.tabs button[aria-current="page"]{color:var(--accent)} .tabs svg{width:22px;height:22px}
main.col{padding-block:6px 120px}
.subtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-top:12px;overflow-x:auto;scrollbar-width:none}
.subtabs button{flex:1 0 auto;border:0;background:none;min-height:44px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;padding:0 12px}
.subtabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.code{font:700 .86rem var(--mono);width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--tile);color:#fff;flex:none}
.right{text-align:right;font-size:.8rem;line-height:1.3} .right b{font-size:1rem;font-variant-numeric:tabular-nums}
/* home: subject blocks with topic rows */
.subject{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.subject header{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px 12px 10px 14px}
.trow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 14px;border:0;border-top:1px solid var(--line);background:none}
.trow:hover{background:var(--soft)}
.trow .tt{display:flex;flex-direction:column;gap:5px;min-width:0}
.trow .tt b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .pct{font:700 .95rem var(--display);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.trow.sel{background:var(--accent-soft)}
.trow input{width:22px;height:22px;accent-color:var(--accent)}
.tags{display:flex;gap:6px;flex-wrap:wrap;font-size:.74rem;font-weight:700}
.tags span{white-space:nowrap}
.t-bad{color:var(--c1)} .t-over{color:var(--warn)} .t-new{color:var(--muted)}
.sfoot{display:flex;gap:8px;padding:10px 12px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.combine{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--band);color:#fff;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.combine .col{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:0}
.combine .btn{min-height:40px;background:var(--band-soft);color:#fff;border-color:transparent}
.combine .btn.primary{background:var(--accent);color:var(--accent-ink)}
.weak{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.weak button{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.weak b{font-variant-numeric:tabular-nums}
.testcard{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;width:100%;text-align:left}
.days{min-width:56px;text-align:center;border-radius:12px;background:var(--accent-soft);color:var(--accent);padding:6px 4px}
.days b{display:block;font:700 1.3rem/1 var(--display)} .days span{font-size:.64rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;min-height:36px;padding:0 14px;font-weight:700;font-size:.86rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg.full{display:flex} .seg.full button{flex:1;min-height:44px}
.ring{position:relative;display:grid;place-items:center} .ring svg{display:block}
.ring .lbl{position:absolute;text-align:center} .ring .lbl b{display:block;font:700 1.9rem/1 var(--display);font-variant-numeric:tabular-nums}
.ring .lbl span{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.statrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--line)}
.statrow b{font-variant-numeric:tabular-nums;font-size:1rem;text-align:right}
.heat{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}
.heat i{display:block;aspect-ratio:1;border-radius:3px;background:var(--soft)}
.goal{display:flex;align-items:center;gap:8px}
.goal .gbar{flex:1;height:8px;border-radius:9px;background:var(--band-soft);overflow:hidden} .goal .gbar i{display:block;height:100%;background:#5CC484}
/* reading */
.prose{line-height:1.6;overflow-wrap:anywhere;font-size:calc(1rem * var(--fs))}
.prose h1,.prose h2,.prose h3,.prose h4{margin:1.1em 0 .4em} .prose h2{font-size:1.15rem} .prose h3{font-size:1.02rem}
.prose p{margin:.5em 0} .prose ul,.prose ol{padding-left:1.3em;margin:.4em 0}
.prose blockquote{margin:.8em 0;padding:10px 14px;border-left:4px solid var(--accent);background:var(--soft);border-radius:0 10px 10px 0}
.prose pre{background:var(--soft);padding:10px 12px;border-radius:10px;overflow-x:auto;font:.86rem/1.5 var(--mono)}
.prose code{font:.88em var(--mono);background:var(--soft);padding:1px 5px;border-radius:5px}
.prose pre code{background:none;padding:0}
.prose table{border-collapse:collapse;display:block;overflow-x:auto;font-size:.9rem;margin:.6em 0}
.prose th,.prose td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.prose img{max-width:100%;border-radius:10px}
.prose a{color:var(--accent)}
.prose .mermaid{background:var(--card);border-radius:10px;padding:8px;overflow-x:auto;text-align:left} .prose .mermaid svg{max-width:none!important;height:auto}
details.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px}
details.sec>summary{cursor:pointer;list-style:none;padding:13px 0;font-weight:700;display:flex;justify-content:space-between;gap:10px}
details.sec>summary::after{content:"▾";color:var(--muted)} details.sec[open]>summary::after{content:"▴"}
details.sec[open]{padding-bottom:12px}
.slides{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.slides button{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);padding:0;position:relative;aspect-ratio:4/3}
.slides img{width:100%;height:100%;object-fit:cover;display:block}
.slides span{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;font:600 .7rem var(--mono);padding:2px 6px;border-radius:6px}
.vid{display:grid;grid-template-columns:132px 1fr;gap:12px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-decoration:none;color:inherit}
.vid img{width:132px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:var(--soft)}
.viewer{position:fixed;inset:0;z-index:40;background:rgba(6,10,22,.94);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));color:#fff}
.viewer .stage{flex:1;display:grid;place-items:center;min-height:0;touch-action:pan-y}
.viewer img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;background:#fff}
.viewer .vbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.viewer .icon-btn{background:#ffffff1f;border-color:transparent;color:#fff}
/* study */
.study{flex:1;display:flex;flex-direction:column;width:100%;max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:env(safe-area-inset-top,0px)}
.shead{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--paper);display:flex;align-items:center;gap:8px;padding-block:10px}
.prog{flex:1;height:6px;border-radius:9px;background:var(--soft);overflow:hidden} .prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.face{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px -18px rgba(10,20,50,.45);overflow:hidden;margin-top:4px}
.face .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:10px 10px 0 18px;font-size:.78rem;color:var(--muted)}
.face .q{padding:12px 18px 14px;border-bottom:2px solid var(--rule);font-size:calc(1.16rem * var(--fs));line-height:1.45;font-weight:700}
.face .a{padding:14px 18px 18px;line-height:1.75;font-size:calc(1.04rem * var(--fs));overflow-wrap:anywhere}
.face .a.hidden{display:grid;place-items:center;min-height:130px;color:var(--muted);line-height:1.4;text-align:center;cursor:pointer}
.recall{font:700 .72rem var(--mono);padding:3px 7px;border-radius:999px;border:1.5px solid currentColor}
.star{border:0;background:none;font-size:1.15rem;color:var(--muted);min-width:38px;min-height:38px}
.star[aria-pressed="true"]{color:#E9BC22}
.helpers{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.helpers .btn{min-height:38px;font-size:.88rem;padding:0 14px}
.xpl{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--soft);line-height:1.55;font-size:calc(.97rem * var(--fs))}
.xpl .eyebrow{display:block;margin-bottom:6px}
.xpl.ai{background:color-mix(in srgb,var(--accent) 10%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.slidebox{margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;cursor:zoom-in;display:block;width:100%;padding:0}
.slidebox img{display:block;width:100%}
.slidebox span{display:block;background:var(--card);color:var(--muted);font-size:.8rem;padding:6px 10px;text-align:left}
.note{display:flex;align-items:center;gap:8px;margin-top:10px;padding:10px 14px;border-radius:12px;border:1px dashed var(--line);color:var(--ink);text-decoration:none;font-size:.92rem}
.verdict{display:flex;align-items:center;gap:8px;font-weight:700;padding:10px 14px;border-radius:12px;margin-top:12px}
.verdict.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.verdict.no{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.cmdbox{width:100%;min-height:52px;margin-top:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:12px 14px;font:calc(.95rem * var(--fs)) var(--mono)}
.diff{font:calc(.92rem * var(--fs))/1.7 var(--mono);overflow-wrap:anywhere} .diff .bad{background:color-mix(in srgb,var(--bad) 22%,transparent);border-radius:4px;padding:0 2px} .diff .miss{color:var(--bad);text-decoration:underline}
.dock{position:sticky;bottom:0;background:var(--paper);padding-block:10px calc(12px + env(safe-area-inset-bottom,0px));margin-top:auto;z-index:4}
.ask{text-align:center;font-weight:700;font-size:.9rem;margin-bottom:8px}
.rate{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;justify-items:center}
.rate div{display:flex;flex-direction:column;align-items:center;gap:4px}
.rate button{width:min(62px,16vw);aspect-ratio:1;border-radius:50%;border:0;color:#fff;font:700 1.35rem var(--display);box-shadow:0 4px 0 rgba(0,0,0,.12)}
.rate button:active{transform:translateY(2px);box-shadow:none}
.rate small{font:600 .7rem var(--mono);color:var(--muted)}
.rate .r1{background:var(--c1)}.rate .r2{background:var(--c2)}.rate .r3{background:var(--c3)}.rate .r4{background:var(--c4)}.rate .r5{background:var(--c5)}
.ratelbl{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);margin-top:4px;padding:0 4px}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px} .tf .btn{min-height:56px;border-radius:14px}
.answerbox{width:100%;min-height:72px;margin-top:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:10px 12px;resize:vertical}
.opt{display:block;width:100%;text-align:left;min-height:54px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);line-height:1.4}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.timer{font:700 1rem var(--mono);font-variant-numeric:tabular-nums;padding:6px 10px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.timer.low{color:var(--bad);border-color:var(--bad)}
.search{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--paper);padding-block:10px 8px}

<script>
(() => {

// ================================================================ config

let mermaidLoading = null;

// ================================================================ local storage
const IDB = (() => {

const LS = {get: k => { try { return JSON.parse(localStorage.getItem("recall." + k)); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem("recall." + k, JSON.stringify(v)); } catch (e) {} }};
let dev = LS.get("dev") || "w" + Math.random().toString(36).slice(2, 8); LS.set("dev", dev);

// ================================================================ state
// Keys must match the iPhone app's Settings so neither side drops the other's values.
const DEFAULT_SETTINGS = {goal: 25, newPerDay: 20, round: 10, retention: 0.9, preset: "smart", custom: [7, 30, 90, 1440, 86400], typeAnswer: false, planner: true,

  maxIvl: 365, leech: 6, plannerDays: 3, reviewCap: 0, interleave: true, autoX: true, autoRead: false, voice: "", rate: 1, aiLang: "English", aiHint: true, hidden: {}, theme: "auto", u: 0};
const PRESETS = {
  smart: {label: "Smart", hint: "1–3 come back in minutes; 4–5 are spaced by your memory model (FSRS)", m: [7, 30, 90, null, null]},
  cram: {label: "Cram", hint: "everything comes back fast — a test is soon", m: [1, 5, 30, 240, 1440]},
  longterm: {label: "Long-term", hint: "fewer reviews, longer gaps", m: [10, 60, 1440, 43200, 525600]},
  custom: {label: "Custom", hint: "your own gaps", m: null},

const STATUS = {exam: "Exam soon", active: "Active", maintain: "Maintaining", paused: "Paused"};
const STATUS_HINT = {exam: "most of the mix; the exam planner raises new cards", active: "normal daily study", maintain: "few new cards, keeps old ones fresh", paused: "hidden from Learn and the mix"};
const blankState = () => ({session: null, user: null, cursor: "", progress: {}, meta: {settings: Object.assign({}, DEFAULT_SETTINGS), days: {}, edits: {}, custom: {}, bm: {}}, tests: [], dirty: [], metaDirty: false, testsDirty: []});
let S = blankState();
let DECK = null, LIB = null;
const settings = () => S.meta.settings;
let saveT = 0;

// ================================================================ login relay + Neon Data API
let JWT = null, JWT_EXP = 0;
const jwtExp = t => { try { return JSON.parse(atob(t.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))).exp * 1000; } catch (e) { return 0; } };
async function relay(path, body, auth) {
  const h = {"Content-Type": "application/json"};
  if (auth) h.Authorization = "Bearer " + await token();
  const r = await fetch(RELAY + path, {method: "POST", headers: h, body: JSON.stringify(body)});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(d.error || r.statusText); e.status = r.status; throw e; }
  return d;
}
function takeLogin(d) { S.session = d.session; S.user = d.user; JWT = d.jwt; JWT_EXP = jwtExp(d.jwt); persist(); }
async function token(force) {
  if (!force && JWT && JWT_EXP - now() > 60000) return JWT;
  if (!S.session) { const e = new Error("Signed out"); e.status = 401; throw e; }
  const d = await relay("/token", {session: S.session});

}
async function rest(method, path, body, prefer, retried) {
  const t = await token();

const UPSERT = "resolution=merge-duplicates,return=minimal";

// private files (lecture PDFs, slides, figures): short-lived links from the relay, cached a little under their lifetime
const URLS = new Map();
async function fileUrls(keys) {
  const t = now(), need = [...new Set(keys)].filter(k => !(URLS.get(k) && URLS.get(k).until > t));
  for (let i = 0; i < need.length; i += 120) {
    const d = await relay("/files", {keys: need.slice(i, i + 120)}, true);
    for (const [k, u] of Object.entries(d.urls || {})) URLS.set(k, {url: u, until: t + 25 * MIN});

}

  if (S.session === "demo") return;

  if (!imgs.length) return;
  try { const u = await fileUrls(imgs.map(i => i.dataset.key)); imgs.forEach(i => { if (u[i.dataset.key]) { i.src = u[i.dataset.key]; i.removeAttribute("data-key"); } }); }

}

// ================================================================ sync

      await rest("POST", "/progress?on_conflict=user_id,card", rows, UPSERT);

// ================================================================ deck index
let GROUPS = {}, TOPICS = {}, CARDS = [], BYID = {}, BYGROUP = {}, BYTOPIC = {};
function indexDeck() {
  if (!DECK) return;

// ================================================================ Progress
function vProgress() {
  const d = today(), days = []; for (let k = 13; k >= 0; k--) days.push(Object.assign({d: d - k}, dayTotals(d - k)));
  const mx = Math.max(1, ...days.map(x => x.n));
  const fc = []; for (let k = 0; k < 7; k++) { const end = dayStartMs(d + k + 1), start = k === 0 ? -Infinity : end - DAY; let n = 0; for (const c of CARDS) { const s = S.progress[c.id]; if (s && s.d < end && s.d >= start) n++; } fc.push({d: d + k, n}); }
  const fx = Math.max(1, ...fc.map(x => x.n)), L = levels(CARDS), seen = CARDS.length - L[0];
  const tot = days.reduce((s, x) => s + x.n, 0), good = days.reduce((s, x) => s + x.g, 0), week = days.slice(-7).reduce((s, x) => s + x.ms, 0);
  const tests = S.tests.slice(-12).reverse();
  return `<header class="band"><div class="col">${bandTop()}<div class="hello">Progress</div><div class="kpis"><div class="kpi"><span>Recall (14 d)</span><b>${tot ? Math.round(good / tot * 100) : 0}%</b></div><div class="kpi"><span>Target</span><b>${Math.round(settings().retention * 100)}%</b></div><div class="kpi"><span>Min this week</span><b>${Math.round(week / 60000)}</b></div></div></div></header><main class="col">
  <div class="section"><div class="eyebrow">Cards per day · last 14 days</div><div class="panel"><div class="chart">${days.map(x => `<div title="${isoOf(x.d)}: ${x.n} cards, ${Math.round(x.ms / 60000)} min"><span>${x.n || ""}</span><i style="height:${x.n / mx * 100}%"></i><span>${isoOf(x.d).slice(8)}</span></div>`).join("")}</div></div></div>
  <div class="section"><div class="eyebrow">Coming due · next 7 days</div><div class="panel"><div class="chart">${fc.map((x, k) => `<div><span>${x.n || ""}</span><i style="height:${x.n / fx * 100}%;background:var(--c5)"></i><span>${k === 0 ? "now" : new Date(x.d * DAY).toLocaleDateString("en-GB", {weekday: "short", timeZone: "UTC"})}</span></div>`).join("")}</div></div></div>
  <div class="section"><div class="eyebrow">Confidence of all cards</div><div class="panel stack" style="align-items:center">${ring(L, 170, (mastery(CARDS) * 100).toFixed(1) + "%", "Mastery")}<div class="row small muted num" style="justify-content:center">${[0, 1, 2, 3, 4, 5].map(k => `<span><span class="dot" style="background:var(--c${k})"></span> ${k === 0 ? "new" : k}: ${L[k]}</span>`).join("")}</div><div class="small muted">${seen} of ${CARDS.length} cards started</div></div></div>
  <div class="section"><div class="eyebrow">By subject</div><div class="panel tablewrap"><table><thead><tr><th>Subject</th><th class="n">Mastery</th><th class="n">Started</th><th class="n">Don't know</th><th class="n">Recall now</th></tr></thead><tbody>${DECK.groups.map(g => { const cs = BYGROUP[g.id] || [], c = counts(cs), st = cs.filter(x => S.progress[x.id]); const rn = st.length ? st.reduce((a, x) => a + recallOf(x), 0) / st.length : null; return `<tr><td><b>${esc(g.title)}</b> <span class="muted small">${esc(g.name)}</span></td><td class="n">${(c.m * 100).toFixed(1)}%</td><td class="n">${c.seen}/${c.n}</td><td class="n">${c.weak}</td><td class="n">${rn === null ? "—" : Math.round(rn * 100) + "%"}</td></tr>`; }).join("")}</tbody></table></div><p class="small muted">Mastery = average of your latest 1–5 ratings (unseen cards count 0), as in Brainscape. Recall now = the memory model's estimate of what you'd remember today. Recall (14 d) = share of your ratings that were 3 or higher.</p></div>
  <div class="section"><div class="eyebrow">Tests & exams</div>${tests.length ? `<div class="panel tablewrap"><table><thead><tr><th>Date</th><th>Test</th><th class="n">Score</th><th class="n">Time</th></tr></thead><tbody>${tests.map(x => `<tr><td class="num">${new Date(x.ts).toLocaleDateString("en-GB", {day: "numeric", month: "short"})}</td><td>${esc(GROUPS[x.g] ? GROUPS[x.g].title : x.g)} ${esc(x.title)}</td><td class="n">${x.right}/${x.n}${x.pts ? ` <span class="muted">(${(x.right / x.n * x.pts).toFixed(1)}/${x.pts})</span>` : ""}</td><td class="n">${fmtTime(x.secs)}</td></tr>`).join("")}</tbody></table></div>` : `<p class="muted">No tests yet. Open the Tests tab to take one.</p>`}</div></main>` + tabs("progress");
}

// ================================================================ viewers
function slideViewer(list, i, title) {
  window._sv = {list, i, title};
  const s = list[i];
  layer.innerHTML = `<div class="viewer" role="dialog" aria-modal="true"><div class="vbar"><span class="small">${esc(title)} · ${s.n != null ? "slide " + s.n : (i + 1) + " / " + list.length}</span><span class="row" style="gap:6px">${s.text ? `<button class="icon-btn" data-act="svListen" aria-label="Read this slide aloud">🔊</button>` : ""}<button class="icon-btn" data-act="closeSheet" aria-label="Close">✕</button></span></div><div class="stage" id="svStage"><img data-key="${s.key}" alt="${esc(s.alt || ("Slide " + (s.n || "")))}"></div>${s.alt ? `<p class="small" style="margin:6px 0">${esc(s.alt)}</p>` : ""}<div class="vbar"><button class="icon-btn" data-act="svPrev" aria-label="Previous" ${i ? "" : "disabled"}>‹</button><span class="small num">${i + 1} / ${list.length}</span><button class="icon-btn" data-act="svNext" aria-label="Next" ${i < list.length - 1 ? "" : "disabled"}>›</button></div></div>`;
  fillImages(layer);
  const st = document.getElementById("svStage"); let x0 = null;
  st.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, {passive: true});
  st.addEventListener("touchend", e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 50) slideStep(dx < 0 ? 1 : -1); x0 = null; });
}
function slideStep(d) { const v = window._sv; if (!v) return; const j = clamp(v.i + d, 0, v.list.length - 1); if (j !== v.i) slideViewer(v.list, j, v.title); }

// ================================================================ events
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, ds = el.dataset;
  if (act === "closeSheet" && (el.classList.contains("scrim")) && e.target !== el) return;
  const set = (k, v) => { S.meta.settings[k] = v; S.meta.settings.u = now(); markMeta(); };
  const topicCards = t => studyCards(BYTOPIC[t] || []);
  switch (act) {
    case "tab": session = null; closeSheet(); picked.clear(); go(ds.gf ? {name: "search", gf: ds.gf} : {name: ds.v, g: ds.g}); break;
    case "ttab": view.tab = ds.v; render(); break;
    case "topic": closeSheet(); go({name: "topic", t: ds.t, tab: "learn"}); break;
    case "testpage": closeSheet(); go({name: "testpage", g: ds.g, t: ds.t}); break;
    case "testsFilter": view.g = ds.v || undefined; render(); break;
    case "selectMode": view.select = !view.select; if (!view.select) picked.clear(); render(); break;
    case "selectModeG": closeSheet(); view = {name: "learn", select: true}; render(); toast("Tick topics, then Study, Drill or Test"); break;
    case "combineWith": closeSheet(); picked = new Set([ds.t]); go({name: "learn", select: true}); toast("Tick more topics to combine"); break;
    case "pick": picked.has(ds.t) ? picked.delete(ds.t) : picked.add(ds.t); render(); break;
    case "clearPicked": picked.clear(); view.select = false; render(); break;
    case "studyPicked": startStudy(cardsOfTopics(picked), "srs", plural(picked.size, "topic") + " combined"); break;
    case "drillPicked": drillSheet(studyCards(cardsOfTopics(picked)), plural(picked.size, "topic") + " · drill"); break;
    case "testPicked": { const ts = [...picked]; testSheet(ts, TOPICS[ts[0]].g); break; }
    case "listenPicked": listen(plural(picked.size, "topic"), [...picked].flatMap(t => [TOPICS[t].title + ".", libTopic(t).summary || "", libTopic(t).remember || ""])); break;

  const q = new URLSearchParams(location.search), v = q.get(VERIFIER);
  if (!v) return false;
  let ch = null; try { ch = sessionStorage.getItem("recall.gch") || localStorage.getItem("recall.gch"); sessionStorage.removeItem("recall.gch"); localStorage.removeItem("recall.gch"); } catch (e) {}
  q.delete(VERIFIER); history.replaceState(null, "", location.pathname + (q.toString() ? "?" + q : "") + location.hash);
  if (!ch) { view = {name: "login", err: "Google sign-in took too long. Try again."}; render(); return true; }
  try { takeLogin(await relay("/google/finish", {verifier: v, challenge: ch})); return true; }
  catch (e) { view = {name: "login", err: e.status === 401 ? "Google sign-in expired. Try again." : "Google sign-in failed — " + e.message}; render(); return true; }
}

// ================================================================ boot
(async () => {
  const saved = await IDB.get("state");
  if (saved && saved.session) { S = Object.assign(blankState(), saved); S.meta.settings = Object.assign({}, DEFAULT_SETTINGS, S.meta.settings || {}); ["edits", "custom", "bm", "days"].forEach(k => S.meta[k] = S.meta[k] || {}); }
  applyTheme();
  // Local check only: http://127.0.0.1:8091/app/web/?demo reads the built deck and library from this Mac, without signing in or syncing.
  if (/^(127\.0\.0\.1|localhost)$/.test(location.hostname) && new URLSearchParams(location.search).has("demo")) {
    DECK = await (await fetch("/data/cards.json")).json(); LIB = await (await fetch("/data/library.json")).json();
    S = blankState(); S.session = "demo"; S.user = {id: "demo", email: "demo@recall.test", name: "Demo"}; indexDeck(); return go({name: "learn"});
  }
  DECK = await IDB.get("deck"); LIB = await IDB.get("lib");
  const fromGoogle = await googleFinish();
  if (fromGoogle && !S.session) return;
  if (!S.session) { view = {name: "login"}; return render(); }
  if (DECK) { indexDeck(); view = {name: "learn"}; render(); }
  await sync();
  if (!S.session) return;
  if (!DECK) { view = {name: "login", err: "Couldn't load your cards. Check the connection and sign in again."}; return render(); }
  if (view.name === "boot") go({name: "learn"});
})();
if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = () => { if (view.name === "settings") render(); };
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
