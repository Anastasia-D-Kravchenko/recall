<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recall sign-in</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#162240;color:#fff;font:17px/1.5 system-ui,sans-serif;text-align:center;padding:16px}a{color:#AFC0E2}</style></head>
<body><div><p>Returning to the Recall app…</p><p><a id="open" href="#">Open Recall</a></p></div>
<script>
// Google sign-in for the iPhone app ends here; pass the one-time verifier back to the app.
const target = "recall://google" + location.search;
document.getElementById("open").href = target;
location.replace(target);
</script></body></html>
